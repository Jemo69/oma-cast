name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # WarpBuild's 2-vCPU Ubuntu runner; the TEST_RUNNER repo variable
    # overrides it (e.g. forks without the WarpBuild app set ubuntu-latest).
    runs-on: ${{ vars.TEST_RUNNER || 'warp-ubuntu-latest-x64-2x' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Glob, not a directory: Node 24 doesn't expand `node --test tests/`.
      # The live Omarchy menu test skips itself when Omarchy isn't installed.
      - name: Unit tests
        run: node --test tests/*.test.js

      # The shared core runs against the Electron port's own tests too
      # (theme golden values, JsonStore, the backend RPC surface).
      - name: Electron port tests
        working-directory: electron
        run: |
          npm ci
          npm test

      - name: Shell syntax
        run: bash -n bin/oma-cast tests/smoke.sh

      - name: Plugin manifest is valid JSON
        run: node -e 'JSON.parse(require("fs").readFileSync("plugin/manifest.json", "utf8"))'

  build-windows:
    # Test build of the Windows port: run the whole suite on a real Windows
    # runner, then package a runnable win32-x64 tree as an artifact.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # @electron/get caches the dev electron dist zip per user.
      - name: Cache Electron dist
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}

      # electron-builder's own downloads (NSIS tooling, winCodeSign stubs).
      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Install
        working-directory: electron
        run: npm ci

      - name: Unit tests (shared core + port)
        working-directory: electron
        run: npm test

      # NSIS installer: dist/oma-cast-<version>-setup.exe plus a portable
      # win-unpacked tree. Everything the app needs at runtime lives in the
      # asar or resources/plugin (extraResources: the shared core).
      - name: Build installer (win32-x64)
        working-directory: electron
        run: npm run dist

      - name: Smoke-check the build layout
        working-directory: electron
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "oma-cast-*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "setup exe missing" }
          foreach ($needed in @(
            "win-unpacked\oma-cast.exe",
            "win-unpacked\resources\app.asar",
            "win-unpacked\resources\plugin\core\Ranker.js",
            "win-unpacked\resources\plugin\core\Paths.js"
          )) {
            if (-not (Test-Path (Join-Path "dist" $needed))) { throw "$needed missing" }
          }
          Write-Output "build ok: $($setup.Name) ($([math]::Round($setup.Length/1MB)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: oma-cast-setup-win32-x64
          path: electron/dist/oma-cast-*-setup.exe
          if-no-files-found: error
